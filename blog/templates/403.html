{% extends "blog/base.html" %}
{% load i18n %}

{% block title %}403{% endblock %}

{% block content %}
<div class="error-wrap">
  <div class="glass-card error-card">
    <p class="error-code">403</p>
    <h1>{% trans "Access denied" %}</h1>
    <p class="error-text">{% trans "You don't have permission to open this page. Maybe sign in first?" %}</p>
    <a href="{% url 'pages:home' %}" class="btn-auth error-btn">{% trans "Back to home" %}</a>
  </div>
</div>
{% endblock %}
