{% extends "blog/base.html" %}
{% load i18n %}

{% block title %}400{% endblock %}

{% block content %}
<div class="error-wrap">
  <div class="glass-card error-card">
    <p class="error-code">400</p>
    <h1>{% trans "Bad request" %}</h1>
    <p class="error-text">{% trans "We couldn't understand that request. A fresh start usually helps." %}</p>
    <a href="{% url 'pages:home' %}" class="btn-auth error-btn">{% trans "Back to home" %}</a>
  </div>
</div>
{% endblock %}
