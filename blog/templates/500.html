{% extends "blog/base.html" %}
{% load i18n %}

{% block title %}500{% endblock %}

{% block content %}
<div class="error-wrap">
  <div class="glass-card error-card">
    <p class="error-code">500</p>
    <h1>{% trans "Something went wrong" %}</h1>
    <p class="error-text">{% trans "It's not you, it's us. We're fixing it — try again in a moment." %}</p>
    <a href="{% url 'pages:home' %}" class="btn-auth error-btn">{% trans "Back to home" %}</a>
  </div>
</div>
{% endblock %}
