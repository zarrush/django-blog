{# Pagination controls; included wherever a paginated list is rendered. #}
<nav class="pagination" aria-label="Pagination">
    <span class="step-links">
        {% if posts.has_previous %}
            <a href="?page={{ posts.previous_page_number }}" rel="prev">Previous</a>
        {% endif %}

        <span class="current">
            Page {{ posts.number }} of {{ posts.paginator.num_pages }}.
        </span>

        {% if posts.has_next %}
            <a href="?page={{ posts.next_page_number }}" rel="next">Next</a>
        {% endif %}
    </span>
</nav>
