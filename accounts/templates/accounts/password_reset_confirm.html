{% extends "blog/base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-container">
  <h2 class="auth-title">{% trans "Set a new password" %}</h2>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {% if form.errors %}
      <div class="auth-errors"><span>{% trans "Please correct the errors and try again." %}</span></div>
    {% endif %}
    <input type="password" name="new_password1" placeholder="{% trans 'New password' %}" required>
    <input type="password" name="new_password2" placeholder="{% trans 'Confirm new password' %}" required>
    <button type="submit" class="btn-auth">{% trans "Change password" %}</button>
  </form>
</div>
{% endblock %}
