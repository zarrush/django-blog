{% extends "blog/base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-container">
  <h2 class="auth-title">{% trans "Forgot password" %}</h2>
  <p class="auth-hint">{% trans "Enter your email and we'll send you a reset link." %}</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    <input type="email" name="email" placeholder="{% trans 'Email' %}" required aria-label="{% trans 'Email' %}">
    <button type="submit" class="btn-auth">{% trans "Send reset link" %}</button>
  </form>
</div>
{% endblock %}
