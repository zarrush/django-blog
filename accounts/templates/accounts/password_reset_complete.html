{% extends "blog/base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-container">
  <h2 class="auth-title">{% trans "Password changed" %}</h2>
  <p class="auth-hint">{% trans "Your password has been reset. You can now sign in." %}</p>
  <p class="auth-switch"><a href="{% url 'accounts:auth' %}">{% trans "Sign In" %}</a></p>
</div>
{% endblock %}
