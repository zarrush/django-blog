{% extends "blog/base.html" %}
{% load i18n %}
{% block content %}
<div class="auth-container">
  <h2 class="auth-title">{% trans "Check your email" %}</h2>
  <p class="auth-hint">{% trans "If an account exists with that email, we've sent a password reset link." %}</p>
  <p class="auth-switch"><a href="{% url 'accounts:auth' %}">{% trans "Back to Sign In" %}</a></p>
</div>
{% endblock %}
